[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-knowledge-extractor-skillset"
version = "0.1.0"
description = "Independent agent skills for transcript-to-knowledge workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "chaoshou-coder" },
]
keywords = [
    "agent-skills",
    "skillset",
    "video-knowledge",
    "transcript",
    "knowledge-extraction",
]
