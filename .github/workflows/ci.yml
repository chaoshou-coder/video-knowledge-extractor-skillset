name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        # Ensure runtime imports used by `python kl.py ...` are present in CI smoke jobs.
        pip install click httpx pydantic python-frontmatter tomli

    - name: Run CLI smoke checks
      run: |
        python kl.py process examples/sample1.srt --mock -o exports_ci
        python kl.py process examples/sample2.txt --mock -o exports_ci

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install lint tools
      run: |
        pip install ruff

    - name: Lint with ruff
      run: |
        ruff check src/

    - name: Validate skills layout
      run: |
        python tools/validate_skills.py --skills-dir skills
